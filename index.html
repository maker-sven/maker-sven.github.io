<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07070a">
<title>Makingshortless — Tijdelijk offline</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--text:#f7f7fb;--muted:#a5a5b3;--line:rgba(255,255,255,.09);--a:#8b5cf6;--b:#ec4899}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;text-align:center;overflow:hidden}body:before{content:"";position:fixed;width:650px;height:650px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.16),transparent 68%);top:-280px;right:-180px;pointer-events:none}body:after{content:"";position:fixed;width:550px;height:550px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.09),transparent 68%);bottom:-280px;left:-220px;pointer-events:none}main{width:min(720px,calc(100% - 36px));position:relative;z-index:1}.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:42px;font-weight:800;letter-spacing:.12em;font-size:14px}.brand img{width:40px;height:40px;object-fit:contain}.kicker{color:#a78bfa;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800;margin-bottom:14px}.icon{width:58px;height:58px;margin:0 auto 25px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(236,72,153,.14));display:grid;place-items:center;font-size:25px}h1{font-size:clamp(42px,8vw,70px);line-height:.98;letter-spacing:-.06em;margin:0 0 20px}p{color:var(--muted);font-size:16px;line-height:1.65;max-width:560px;margin:0 auto}.line{width:70px;height:2px;margin:34px auto;background:linear-gradient(90deg,var(--a),var(--b));border-radius:9px}.contact{font-size:13px;color:#777783}.contact a{color:#c084fc;text-decoration:none;font-weight:700}@media(max-width:600px){main{width:min(100% - 28px,720px)}.brand{margin-bottom:34px}.brand img{width:35px;height:35px}.brand{font-size:12px}p{font-size:14px}h1{font-size:44px}}
</style>
</head>
<body>
<main>
<a class="brand" href="mailto:maker@makingshortless.com"><img src="logo.png" alt="Makingshortless logo"><span>MAKINGSHORTLESS</span></a>
<div class="icon">✦</div>
<div class="kicker">Tijdelijk offline</div>
<h1>We zijn even<br>aan het bouwen.</h1>
<p>Makingshortless is tijdelijk offline. We zijn momenteel bezig met enkele verbeteringen achter de schermen. Binnenkort zijn we weer online.</p>
<div class="line"></div>
<div class="contact">Vragen? <a href="mailto:maker@makingshortless.com">maker@makingshortless.com</a></div>
</main>
</body>
</html>
