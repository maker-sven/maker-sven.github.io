<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Makingshortless — Tijdelijk offline</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07070a;color:#f7f7fb}body{display:grid;place-items:center;padding:24px;text-align:center}main{width:min(680px,100%);padding:56px 28px;border:1px solid rgba(255,255,255,.09);border-radius:28px;background:linear-gradient(145deg,rgba(139,92,246,.12),rgba(236,72,153,.05)),#0d0d12;box-shadow:0 25px 80px rgba(0,0,0,.35)}.brand{font-weight:900;letter-spacing:-.05em;font-size:20px;margin-bottom:44px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#ec4899);margin-right:9px;box-shadow:0 0 15px #b45cff}h1{font-size:clamp(38px,8vw,64px);line-height:.98;letter-spacing:-.06em;margin:0 0 20px}p{color:#a5a5b3;font-size:16px;line-height:1.6;margin:0}.grad{background:linear-gradient(100deg,#fff,#b98aff,#ff71bc);-webkit-background-clip:text;background-clip:text;color:transparent}@media(max-width:480px){main{padding:42px 20px}.brand{margin-bottom:34px}p{font-size:14px}}
</style>
</head>
<body><main><div class="brand"><span class="dot"></span>MAKINGSHORTLESS</div><h1>We zijn <span class="grad">even offline.</span></h1><p>De website wordt momenteel bijgewerkt. We zijn binnenkort weer online.</p></main></body>
</html>
