name: Add quote links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link quote CTAs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          s2 = re.sub(r'href="mailto:maker@makingshortless\.com\?subject=[^"]*"', 'href="offerte-aanvragen.html"', s)
          if s2 == s:
              raise SystemExit('No quote CTA links found')
          p.write_text(s2)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Link CTAs to quote request form' || exit 0
          git push
