name: Deploy Makingshortless to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare PDF download link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('algemene-voorwaarden.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="algemene-voorwaarden.txt" download', 'href="algemene-voorwaarden.pdf" download')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install PDF generator
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Generate general terms PDF
        run: python -c "from weasyprint import HTML; HTML('algemene-voorwaarden.html', base_url='.').write_pdf('algemene-voorwaarden.pdf')"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
